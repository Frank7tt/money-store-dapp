<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blockchain Application</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
</head>
<body>
  <!-- Welcome -->
  <div class="container" id="welcomeView">
    <h2>Welcome to blockchain application</h2>
    <h4>Please enter your name</h4>
    <form id="nameForm">
      <input type="text" id="name" autocomplete="off" />
      <input type="submit" value="Enter" />
    </form>
  </div>

  <!-- Main -->
  <div class="container hidden" id="mainView">
    <h2>Main</h2>
    <p class="hello" id="hello"></p>
    <button class="btn" data-go="transferView">Transfer Money</button>
    <button class="btn" data-go="storeView">Store Money</button>
    <button class="btn" id="exitBtn">Exit</button>
  </div>

  <!-- Transfer Money -->
  <div class="container hidden" id="transferView">
    <h2>Transfer Money</h2>
    <input type="text" id="payer" placeholder="Enter payer address" />
    <input type="text" id="payee" placeholder="Enter payee address" />
    <input type="number" id="tAmount" min="1" placeholder="Enter amount" />
    <button class="wide" id="transferBtn">Transfer</button>
    <button class="wide" data-tx>transaction</button>
    <button class="btn" data-go="mainView">Main</button>
  </div>

  <!-- Store Money -->
  <div class="container hidden" id="storeView">
    <h2>Store Money</h2>
    <input type="text" id="depositor" placeholder="Enter depositor address" />
    <input type="number" id="sAmount" min="1" placeholder="Enter amount" />
    <button class="wide" id="storeBtn">Transfer</button>
    <button class="wide" data-tx>transaction</button>
    <button class="btn" data-go="mainView">Main</button>
  </div>

  <div id="status"></div>

  <script src="app.js"></script>
</body>
</html>
