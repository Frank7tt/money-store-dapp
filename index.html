<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Money Store DApp</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
</head>
<body>
  <!-- Connect page -->
  <div class="card" id="connectView">
    <h1>Money Store</h1>
    <label>Contract address</label>
    <input id="contractAddr" placeholder="0x... (paste after deploying in Remix)" />
    <button class="btn" id="connectBtn">Connect MetaMask</button>
  </div>

  <!-- Main page (same as the slide) -->
  <div class="card hidden" id="mainView">
    <h1>Main</h1>
    <p class="info">Account: <span id="account"></span></p>
    <p class="info">Stored balance: <b><span id="balance">0</span> ETH</b></p>

    <div class="row">
      <input id="depositAmt" type="number" step="0.001" min="0" placeholder="Amount (ETH)" />
      <button class="btn small" id="depositBtn">Store Money</button>
    </div>

    <button class="btn" id="goTransferBtn">Transfer Money</button>
    <button class="btn" id="exitBtn">Exit</button>
  </div>

  <!-- Transfer page -->
  <div class="card hidden" id="transferView">
    <h1>Transfer Money</h1>
    <label>Recipient address</label>
    <input id="toAddr" placeholder="0x..." />
    <label>Amount (ETH)</label>
    <input id="transferAmt" type="number" step="0.001" min="0" placeholder="0.01" />
    <button class="btn" id="transferBtn">Confirm Transfer</button>
    <button class="btn grey" id="backBtn">Back</button>
  </div>

  <p id="status"></p>

  <script src="app.js"></script>
</body>
</html>
